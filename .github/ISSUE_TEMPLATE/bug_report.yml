name: Bug report
description: Something isn't working as expected
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include steps to reproduce.
      placeholder: "1. Create an exchange\n2. …"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: Chrome 131 on macOS 15
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [S1 – blocks draws or leaks pairings, S2 – major feature broken, S3 – minor / cosmetic]
    validations: { required: true }
